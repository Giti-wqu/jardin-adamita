<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf7f2;
  --bg2:#f4ede0;
  --bg3:#ede3d0;
  --ink:#2c1a0e;
  --ink2:#5c3d1e;
  --gold:#b8860b;
  --gold2:#d4a017;
  --sepia:#8b6343;
  --faded:#9c7a5b;
  --dim:#c4a882;
  --border:rgba(184,134,11,.2);
  --border2:rgba(184,134,11,.35);
  --white:#ffffff;
  --panel:#fff9f0;
  --red:#c0392b;
  --redbg:rgba(192,57,43,.08);
  --shadow:0 2px 20px rgba(44,26,14,.08);
  --shadow2:0 4px 40px rgba(44,26,14,.12);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.75}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;background:rgba(250,247,242,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);gap:1rem}
.logo{font-family:'Cormorant SC',serif;font-size:.95rem;font-weight:400;letter-spacing:.15em;color:var(--gold);cursor:pointer;white-space:nowrap;flex-shrink:0}
.logo span{color:var(--sepia);font-size:.6rem;display:block;letter-spacing:.25em;margin-top:-2px}
.topnav{display:flex;align-items:center;gap:.1rem;flex-wrap:nowrap}
.tnav{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.08em;color:var(--sepia);background:none;border:none;padding:.35rem .75rem;cursor:pointer;transition:color .2s;text-transform:uppercase;white-space:nowrap;position:relative}
.tnav:hover,.tnav.active{color:var(--gold)}
.tnav.active::after{content:'';position:absolute;bottom:0;left:.75rem;right:.75rem;height:1px;background:var(--gold)}
.badge{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;font-size:.55rem;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center}
.topright{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.lang-sw{display:flex;gap:2px;align-items:center;margin-right:.3rem}
.ls-btn{font-family:'Inter',sans-serif;font-size:.65rem;letter-spacing:.08em;color:var(--dim);background:none;border:1px solid transparent;padding:.2rem .42rem;cursor:pointer;transition:all .2s;border-radius:3px}
.ls-btn:hover{color:var(--sepia)}
.ls-btn.active{color:var(--gold);border-color:var(--border2);background:rgba(184,134,11,.06)}
.user-name{font-style:italic;color:var(--sepia);font-size:.85rem;white-space:nowrap}
.admin-pill{font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.1em;background:var(--gold);color:#fff;padding:.15rem .5rem;border-radius:3px;white-space:nowrap}
.btn-login{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.08em;color:var(--sepia);border:1px solid var(--border2);background:none;padding:.35rem .9rem;cursor:pointer;transition:all .2s;border-radius:4px;text-transform:uppercase}
.btn-login:hover{color:var(--gold);border-color:var(--gold);background:rgba(184,134,11,.04)}
.btn-register{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.08em;color:#fff;background:var(--gold);border:1px solid var(--gold);padding:.35rem .9rem;cursor:pointer;transition:all .2s;border-radius:4px;text-transform:uppercase}
.btn-register:hover{background:var(--gold2)}
.btn-signout{font-family:'Inter',sans-serif;font-size:.68rem;color:var(--dim);background:none;border:none;padding:.28rem .5rem;cursor:pointer;transition:color .2s}
.btn-signout:hover{color:var(--sepia)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(44,26,14,.5);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.auth-modal{background:var(--white);border:1px solid var(--border);border-radius:8px;width:100%;max-width:420px;padding:2.5rem;position:relative;box-shadow:var(--shadow2)}
.modal-close{position:absolute;top:.8rem;right:.9rem;background:none;border:none;color:var(--dim);font-size:1.1rem;cursor:pointer;padding:.3rem;line-height:1}
.modal-close:hover{color:var(--sepia)}
.modal-title{font-family:'Cormorant SC',serif;font-size:1.5rem;font-weight:300;color:var(--ink);text-align:center;margin-bottom:.3rem}
.modal-sub{font-style:italic;color:var(--faded);text-align:center;font-size:.9rem;margin-bottom:1.6rem}
.modal-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.6rem}
.modal-tab{flex:1;font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.08em;color:var(--dim);background:none;border:none;padding:.6rem;cursor:pointer;transition:all .2s;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.modal-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.1em;color:var(--sepia);margin-bottom:.32rem;text-transform:uppercase}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:.7rem 1rem;font-family:'Cormorant Garamond',serif;font-size:1rem;outline:none;transition:border-color .2s;border-radius:4px}
.form-input:focus{border-color:var(--gold)}
.form-input::placeholder{color:var(--dim)}
.btn-full{width:100%;background:var(--gold);color:#fff;border:none;font-family:'Inter',sans-serif;font-size:.78rem;letter-spacing:.12em;padding:.8rem;cursor:pointer;transition:all .2s;margin-top:.4rem;text-transform:uppercase;border-radius:4px}
.btn-full:hover{background:var(--gold2)}
.btn-full:disabled{opacity:.45;cursor:not-allowed}
.msg-error{background:var(--redbg);border:1px solid rgba(192,57,43,.2);color:var(--red);padding:.6rem 1rem;font-size:.88rem;margin-bottom:.8rem;border-radius:4px}
.msg-ok{background:rgba(39,174,96,.08);border:1px solid rgba(39,174,96,.25);color:#27ae60;padding:.6rem 1rem;font-size:.88rem;margin-bottom:.8rem;border-radius:4px}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:flex;align-items:center;justify-content:center}
.lightbox.hidden{display:none}
.lb-inner{position:relative;max-width:92vw;max-height:92vh}
.lb-inner img{max-width:92vw;max-height:92vh;object-fit:contain;display:block}
.lb-close{position:absolute;top:-30px;right:0;background:none;border:none;color:rgba(255,255,255,.5);font-size:1.2rem;cursor:pointer}
.lb-dl{position:absolute;bottom:-34px;right:0;background:rgba(0,0,0,.7);border:1px solid var(--gold);color:var(--gold);font-family:'Inter',sans-serif;font-size:.7rem;letter-spacing:.1em;padding:.4rem 1rem;cursor:pointer;text-decoration:none;text-transform:uppercase;border-radius:3px}
.lb-wm{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.lb-wm-inner{position:absolute;inset:-50%;transform:rotate(-28deg);display:flex;flex-direction:column}
.wm-row{display:flex;gap:0;white-space:nowrap}
.wm-text{color:rgba(255,255,255,.2);font-size:13px;font-family:'Cormorant Garamond',serif;font-style:italic;padding:18px 22px}
.protected-wrap{position:relative;display:inline-block;user-select:none;cursor:pointer;overflow:hidden}
.protected-wrap img{display:block;pointer-events:none;-webkit-user-drag:none}
.wm-overlay{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.wm-inner{position:absolute;inset:-50%;transform:rotate(-28deg);display:flex;flex-direction:column}
.admin-img-wrap{position:relative;display:inline-block;cursor:pointer}
.dl-btn{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.7);border:1px solid var(--gold);color:var(--gold);font-size:.65rem;padding:.2rem .5rem;cursor:pointer;border-radius:3px;text-decoration:none;z-index:3}

/* HERO */
.hero{min-height:96vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 2rem 4rem;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 50%,var(--bg) 100%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8860b' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");opacity:.4}
.ornament{color:var(--gold);letter-spacing:.5em;margin-bottom:2rem;font-size:.9rem;position:relative}
.hero-title{font-family:'Cormorant SC',serif;font-size:clamp(2.4rem,8vw,5rem);font-weight:300;letter-spacing:.06em;line-height:1.12;color:var(--ink);margin-bottom:.5rem;position:relative;animation:fadeUp 1s ease forwards .3s;opacity:0}
.hero-sub{font-size:clamp(.82rem,2vw,.95rem);font-weight:300;font-style:italic;color:var(--sepia);letter-spacing:.22em;text-transform:uppercase;animation:fadeUp 1s ease forwards .55s;opacity:0;margin-bottom:3rem;position:relative}
.hero-hr{width:50px;height:1px;background:var(--gold);margin:0 auto 3rem;animation:fadeUp 1s ease forwards .7s;opacity:0;position:relative}
.hero-verse{font-size:clamp(1rem,2.4vw,1.3rem);font-style:italic;font-weight:300;color:var(--ink2);max-width:560px;line-height:1.95;animation:fadeUp 1s ease forwards .85s;opacity:0;margin-bottom:1.5rem;position:relative}
.hero-verse em{font-style:normal;color:var(--gold)}
.hero-stats{display:flex;gap:2.5rem;justify-content:center;margin-bottom:2.5rem;animation:fadeUp 1s ease forwards 1s;opacity:0;flex-wrap:wrap;position:relative}
.hero-stat{text-align:center}
.hero-stat-n{font-family:'Cormorant SC',serif;font-size:2rem;font-weight:300;color:var(--gold);display:block;line-height:1}
.hero-stat-l{font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.2em;color:var(--sepia);text-transform:uppercase;margin-top:.2rem;display:block}
.hero-btns{animation:fadeUp 1s ease forwards 1.15s;opacity:0;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;position:relative}
.btn-hero{font-family:'Inter',sans-serif;font-size:.8rem;letter-spacing:.12em;text-decoration:none;padding:.9rem 2rem;cursor:pointer;transition:all .25s;text-transform:uppercase;border:none;display:inline-block;border-radius:4px}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 4px 15px rgba(184,134,11,.3)}
.btn-ghost{color:var(--gold);background:transparent;border:1px solid var(--border2) !important}
.btn-ghost:hover{border-color:var(--gold) !important;background:rgba(184,134,11,.06);transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* SECTIONS */
.sec{padding:5.5rem 2rem;max-width:820px;margin:0 auto}
.sec-label{font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.35em;color:var(--gold);margin-bottom:1.6rem;display:block;text-transform:uppercase}
.sec h2{font-family:'Cormorant SC',serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:300;color:var(--ink);line-height:1.2;margin-bottom:1.6rem}
.sec p{font-size:clamp(.97rem,2vw,1.08rem);color:var(--ink2);font-weight:300;margin-bottom:1.4rem;text-align:justify}
.band{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:5.5rem 2rem}
.band2{background:var(--bg3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:5.5rem 2rem}
.divline{display:flex;align-items:center;gap:1.5rem;padding:0 2rem;max-width:720px;margin:0 auto}
.divline::before,.divline::after{content:'';flex:1;height:1px;background:var(--border2)}
.divline span{color:var(--gold);font-size:.9rem}
.verse-block{border-left:3px solid var(--gold);padding:1.8rem 2.2rem;margin:2.5rem 0;background:var(--panel);border-radius:0 6px 6px 0;box-shadow:var(--shadow)}
.verse-src{font-family:'Inter',sans-serif;font-size:.65rem;letter-spacing:.25em;color:var(--gold);margin-bottom:.65rem;display:block;text-transform:uppercase}
.verse-q{font-style:italic;font-size:clamp(1rem,2.2vw,1.22rem);color:var(--ink);line-height:1.9;margin:0}
.genesis-box{background:var(--panel);border:1px solid var(--border2);border-radius:8px;padding:2.5rem;margin:2.5rem 0;text-align:center;box-shadow:var(--shadow)}
.genesis-ref{font-family:'Cormorant SC',serif;font-size:.75rem;letter-spacing:.3em;color:var(--gold);display:block;margin-bottom:1rem;text-transform:uppercase}
.genesis-text{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,2.5vw,1.4rem);font-style:italic;color:var(--ink);line-height:1.9;margin-bottom:.8rem}
.genesis-note{font-family:'Inter',sans-serif;font-size:.8rem;color:var(--sepia);font-style:normal}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin:2.5rem 0}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:1.5rem;box-shadow:var(--shadow)}
.stat-card-n{font-family:'Cormorant SC',serif;font-size:1.8rem;font-weight:300;color:var(--gold);display:block;margin-bottom:.3rem}
.stat-card-l{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.1em;color:var(--sepia);text-transform:uppercase;margin-bottom:.5rem;display:block}
.stat-card-d{font-size:.88rem;color:var(--faded);margin:0;font-style:italic}
.timeline{margin:2.5rem 0}
.tl-item{display:flex;gap:1.5rem;margin-bottom:2rem;align-items:flex-start}
.tl-year{flex-shrink:0;width:120px;font-family:'Cormorant SC',serif;font-size:.72rem;letter-spacing:.18em;color:var(--gold);padding-top:.2rem;text-transform:uppercase}
.tl-content{border-left:1px solid var(--border2);padding-left:1.5rem;flex:1}
.tl-content p{color:var(--ink2);font-size:.97rem;line-height:1.7;margin:0}
.science-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin:2.5rem 0}
.science-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:1.5rem;box-shadow:var(--shadow)}
.science-card-icon{font-size:1.5rem;margin-bottom:.6rem;display:block}
.science-card-t{font-family:'Inter',sans-serif;font-size:.8rem;letter-spacing:.08em;color:var(--ink);font-weight:500;margin-bottom:.5rem;text-transform:uppercase}
.science-card-d{font-size:.9rem;color:var(--ink2);line-height:1.65;margin:0}
.highlight-box{border:1px solid var(--border2);border-radius:8px;padding:2rem 2.5rem;background:var(--panel);margin:2rem 0;box-shadow:var(--shadow)}
.highlight-box p{font-style:italic;font-size:clamp(1rem,2.2vw,1.18rem);color:var(--ink);line-height:1.9;margin:0}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:2.5rem 0;box-shadow:var(--shadow)}
.book-cell{padding:1rem 1.2rem;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .18s}
.book-cell:hover{background:rgba(184,134,11,.05)}
.book-n{font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.2em;color:var(--gold);display:block;margin-bottom:.22rem;text-transform:uppercase}
.book-t{font-size:.87rem;color:var(--sepia);font-style:italic;margin:0;text-align:left}
.contact-input{width:100%;background:var(--white);border:1px solid var(--border);color:var(--ink);padding:.7rem 1rem;font-family:'Cormorant Garamond',serif;font-size:1rem;outline:none;transition:border-color .2s;margin-bottom:1rem;border-radius:4px}
.contact-input:focus{border-color:var(--gold)}
.contact-input::placeholder{color:var(--dim)}
.contact-ta{width:100%;background:var(--white);border:1px solid var(--border);color:var(--ink);padding:.7rem 1rem;font-family:'Cormorant Garamond',serif;font-size:1rem;outline:none;resize:vertical;min-height:130px;transition:border-color .2s;margin-bottom:1rem;border-radius:4px}
.contact-ta:focus{border-color:var(--gold)}
.contact-ta::placeholder{color:var(--dim)}
.contact-send{background:var(--gold);color:#fff;border:none;font-family:'Inter',sans-serif;font-size:.78rem;letter-spacing:.12em;padding:.8rem 2.2rem;cursor:pointer;transition:all .2s;text-transform:uppercase;border-radius:4px}
.contact-send:hover{background:var(--gold2)}

/* FORUM */
.app-layout{display:flex;max-width:1100px;margin:0 auto;min-height:calc(100vh - 60px)}
.sidebar{width:225px;min-width:225px;border-right:1px solid var(--border);padding:2rem 0;display:flex;flex-direction:column;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;background:var(--bg)}
.sb-label{font-family:'Inter',sans-serif;font-size:.62rem;letter-spacing:.28em;color:var(--gold);padding:0 1.4rem;margin-bottom:.55rem;display:block;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:.55rem;padding:.48rem 1.4rem;cursor:pointer;color:var(--sepia);font-size:.88rem;background:none;border:none;width:100%;text-align:left;transition:all .15s}
.sb-item:hover{color:var(--ink);background:rgba(184,134,11,.06)}
.sb-item.active{color:var(--gold);background:rgba(184,134,11,.1)}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex-shrink:0}
.sb-item.active .sb-dot{background:var(--gold)}
.sb-sep{border:none;border-top:1px solid var(--border);margin:.9rem 0}
.new-btn{margin:.9rem 1.4rem 0;background:var(--gold);color:#fff;border:none;font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.12em;padding:.62rem;cursor:pointer;transition:all .2s;text-transform:uppercase;width:calc(100% - 2.8rem);border-radius:4px}
.new-btn:hover{background:var(--gold2)}
.sb-stat{padding:0 1.4rem;margin-top:1.4rem}
.stat-row{display:flex;justify-content:space-between;margin-bottom:.45rem;font-size:.83rem}
.stat-l{color:var(--sepia);font-style:italic}
.stat-v{color:var(--gold);font-family:'Cormorant SC',serif}
.content{flex:1;padding:2rem;min-width:0;background:var(--bg)}
.post-card{border:1px solid var(--border);background:var(--panel);padding:1.3rem 1.5rem;margin-bottom:.85rem;cursor:pointer;transition:all .18s;border-radius:6px;box-shadow:var(--shadow)}
.post-card:hover{border-color:var(--border2);box-shadow:var(--shadow2);transform:translateY(-1px)}
.pc-title{font-family:'Cormorant SC',serif;font-size:.98rem;font-weight:400;color:var(--ink);margin-bottom:.28rem}
.pc-preview{color:var(--sepia);font-size:.87rem;line-height:1.52}
.pc-meta{display:flex;align-items:center;gap:.75rem;margin-top:.65rem;font-size:.77rem;color:var(--dim);flex-wrap:wrap;font-family:'Inter',sans-serif}

  </div>

<div id="root"></div>
<script>
const SB_URL='https://fyosedvcdsfxgerysixb.supabase.co'
const SB_ANON='sb_publishable_UfOqWAj0TfPyVQK_g0wcKQ_eHqV-BDU'
const ADMIN='jardinadamita@proton.me'
const AMAZON_ES='https://www.amazon.es/dp/B0H33WHVJJ'
const AMAZON_EN='https://www.amazon.com/dp/B0H4FDDFVH'
const sb=supabase.createClient(SB_URL,SB_ANON)

const SUPPORTED=['es','en','de']
function getLang(){
  const url=new URLSearchParams(window.location.search).get('lang')
  if(url&&SUPPORTED.includes(url))return url
  const stored=localStorage.getItem('gardenLang')
  if(stored&&SUPPORTED.includes(stored))return stored
  const bl=navigator.language?.slice(0,2)||'es'
  return SUPPORTED.includes(bl)?bl:'es'
}
function ht(es,en,de){const l=S.lang;return l==='en'?en:l==='de'?de:es}
function setLang(l){S.lang=l;localStorage.setItem('gardenLang',l);document.documentElement.lang=l;render()}

const TEMP_DOMAINS=['mailinator.com','guerrillamail.com','temp-mail.org','throwaway.email','yopmail.com','sharklasers.com','grr.la','spam4.me','trashmail.com','trashmail.me','trashmail.net','tempmail.com','temp-mail.io','10minutemail.com','dispostable.com','maildrop.cc','fakeinbox.com','incognitomail.com','discardmail.com','getnada.com','throwam.com','burnermail.io','emailondeck.com']

let S={
  user:null,profile:null,isAdmin:false,
  page:'home',view:'list',
  posts:[],post:null,replies:[],
  category:null,
  stats:{posts:0,members:0},
  postFiles:[],replyFiles:[],msgFiles:[],
  messages:[],unreadCount:0,
  solicitudes:[],
  compartirAccess:null,
  expandedMsgs:{},
  afterLogin:null,
  usuarios:[],
  visitStats:null,
  lang:getLang()
}
let authMode='login'
let currentLbUrl=''

async function init(){
  document.documentElement.lang=S.lang
  const{data:{session}}=await sb.auth.getSession()
  if(session?.user)await signedIn(session.user)
  setTimeout(async()=>{if(!S.isAdmin)await sb.from('visits').insert({is_registered:!!S.user})},1500)
  await loadStats()
  render()
  sb.auth.onAuthStateChange(async(ev,session)=>{
    if(ev==='SIGNED_IN'){
      await signedIn(session.user);closeModal()
      if(S.afterLogin){const f=S.afterLogin;S.afterLogin=null;await f()}
      else{await loadPosts();await loadStats();render()}
    }
    if(ev==='SIGNED_OUT'){
      Object.assign(S,{user:null,profile:null,isAdmin:false,page:'home',messages:[],unreadCount:0,solicitudes:[],compartirAccess:null})
      render()
    }
  })
}

async function signedIn(u){
  S.user=u;S.isAdmin=u.email===ADMIN
  const{data}=await sb.from('profiles').select('*').eq('id',u.id).single()
  if(data){S.profile=data;sb.from('profiles').update({last_seen_at:new Date().toISOString(),email:u.email}).eq('id',u.id);return}
  const un=S.isAdmin?'El Jardín':u.email.split('@')[0]
  const{data:p}=await sb.from('profiles').insert({id:u.id,username:un,is_admin:S.isAdmin,email:u.email}).select().single()
  S.profile=p
}

async function loadPosts(){
  let q=sb.from('posts').select('*, profiles(username,is_admin), replies(count)').order('created_at',{ascending:false})
  if(S.category)q=q.eq('category',S.category)
  const{data}=await q;S.posts=data||[]
}
async function loadPost(id){
  const[{data:p},{data:r}]=await Promise.all([
    sb.from('posts').select('*, profiles(username,is_admin)').eq('id',id).single(),
    sb.from('replies').select('*, profiles(username,is_admin)').eq('post_id',id).order('created_at',{ascending:true})
  ]);S.post=p;S.replies=r||[]
}
async function loadStats(){
  const[{count:p},{count:m}]=await Promise.all([
    sb.from('posts').select('*',{count:'exact',head:true}),
    sb.from('profiles').select('*',{count:'exact',head:true})
  ]);S.stats={posts:p||0,members:m||0}
}
async function loadMessages(){const{data}=await sb.from('private_messages').select('*, profiles(username)').order('created_at',{ascending:false});S.messages=data||[];S.unreadCount=S.messages.filter(m=>!m.is_read).length}
async function loadSolicitudes(){const{data}=await sb.from('compartir_access').select('*, profiles(username)').eq('status','pending').order('created_at',{ascending:true});S.solicitudes=data||[]}
async function checkCompartirAccess(){if(!S.user){S.compartirAccess='none';return}const{data}=await sb.from('compartir_access').select('status').eq('user_id',S.user.id).single();S.compartirAccess=data?data.status:'none'}
async function loadUsuarios(){const{data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});S.usuarios=data||[]}
async function loadVisitStats(){
  const{data}=await sb.from('visits').select('is_registered, visited_at').order('visited_at',{ascending:false})
  if(!data){S.visitStats=null;return}
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),week=new Date(today)
  week.setDate(week.getDate()-7)
  S.visitStats={totalAll:data.length,totalAnon:data.filter(v=>!v.is_registered).length,totalReg:data.filter(v=>v.is_registered).length,todayAll:data.filter(v=>new Date(v.visited_at)>=today).length,todayAnon:data.filter(v=>!v.is_registered&&new Date(v.visited_at)>=today).length,weekAll:data.filter(v=>new Date(v.visited_at)>=week).length,weekAnon:data.filter(v=>!v.is_registered&&new Date(v.visited_at)>=week).length,last10:data.slice(0,10)}
}

function render(){document.getElementById('root').innerHTML=topbar()+body()}

function topbar(){
  const unread=S.unreadCount>0?`<span class="badge">${S.unreadCount}</span>`:''
  const adminNav=S.isAdmin?`
    <button class="tnav ${S.page==='inbox'?'active':''}" onclick="goInbox()">Mensajes${unread}</button>
    <button class="tnav ${S.page==='solicitudes'?'active':''}" onclick="goSolicitudes()">Solicitudes</button>
    <button class="tnav ${S.page==='usuarios'?'active':''}" onclick="goUsuarios()">Usuarios</button>
    <button class="tnav ${S.page==='visitas'?'active':''}" onclick="goVisitas()">Visitas</button>`:''
  const langSw=`<div class="lang-sw">
    <button class="ls-btn ${S.lang==='es'?'active':''}" onclick="setLang('es')">ES</button>
    <button class="ls-btn ${S.lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
    <button class="ls-btn ${S.lang==='de'?'active':''}" onclick="setLang('de')">DE</button>
  </div>`
  const right=S.user?`<div class="topright">${langSw}<span class="user-name">${esc(S.profile?.username||'')}</span>${S.isAdmin?'<span class="admin-pill">El Jardín</span>':''}<button class="btn-signout" onclick="sb.auth.signOut()">Salir</button></div>`
    :`<div class="topright">${langSw}<button class="btn-login" onclick="openModal('login')">Entrar</button><button class="btn-register" onclick="openModal('register')">Unirse</button></div>`
  return `<header class="topbar">
    <div class="logo" onclick="goHome()">Movimiento Edénico <span>Los Adánicos</span></div>
    <nav class="topnav">
      <button class="tnav ${S.page==='home'?'active':''}" onclick="goHome()">Inicio</button>
      <button class="tnav ${S.page==='forum'?'active':''}" onclick="goForum()">Foro</button>
      <button class="tnav" onclick="scrollToContact()">Escribir</button>
      ${adminNav}
    </nav>
    ${right}
  </header>`
}

function body(){
  if(S.page==='home')return homePage()
  if(S.page==='forum')return forumPage()
  if(S.page==='inbox')return inboxPage()
  if(S.page==='solicitudes')return solicitudesPage()
  if(S.page==='usuarios')return usuariosPage()
  if(S.page==='visitas')return visitasPage()
  return homePage()
}

function homePage(){
  const books=[['I','Del Estado Original'],['II','Del Cuerpo'],['III','Del Deseo y del Cuerpo Honesto'],['IV','De la Ropa como Primer Olvido'],['V','De la Verdad y la Palabra'],['VI','De la Comunidad'],['VII','De la Vida Justa'],['VIII','De los Ritos'],['IX','De las Prohibiciones'],['X','De la Serpiente'],['XI','Del Jardín y de Dios'],['XII','De Cómo se Difunde lo que Vale'],['XIII','Del Silencio'],['XIV','Del Tiempo'],['XV','De la Naturaleza'],['XVI','De la Muerte'],['XVII','De los Hijos'],['XVIII','Del Miedo'],['XIX','Del Amor y las Relaciones'],['XX','De la Soledad'],['XXI','De la Enfermedad y el Dolor'],['XXII','De la Belleza'],['XXIII','De la Historia Viva'],['XXIV','De la Alegría']]

  return `<div>

      ${ht('"Y estaban desnudos, el hombre y su mujer,<br>y no se avergonzaban."<br><em>— Génesis 2:25</em>',
           '"And they were both naked, the man and his wife,<br>and were not ashamed."<br><em>— Genesis 2:25</em>',
           '"Und sie waren beide nackt, der Mensch und seine Frau,<br>und schämten sich nicht."<br><em>— Genesis 2:25</em>')}

    <div class="hero-stats">
      ${S.stats.members>0?`<div class="hero-stat"><span class="hero-stat-n">${S.stats.members}</span><span class="hero-stat-l">${ht('adánicos','adanics','Adaniker')}</span></div>`:''}
      ${S.stats.posts>0?`<div class="hero-stat"><span class="hero-stat-n">${S.stats.posts}</span><span class="hero-stat-l">${ht('conversaciones','conversations','Gespräche')}</span></div>`:''}
    </div>
    <div class="hero-btns">
      <button class="btn-hero btn-gold" style="border:none;" onclick="goForum()">${ht('Entrar al foro','Enter the forum','Forum betreten')}</button>
      <button class="btn-hero btn-ghost" onclick="openModal('register')">${ht('Unirse gratis','Join free','Kostenlos beitreten')}</button>
    </div>
  </section>

  <!-- GÉNESIS -->
  <div class="band">

function forumPage(){
  if(!S.user)return`<div class="empty" style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div class="empty-orn">✦</div>
    <div class="empty-t" style="font-size:1.2rem;">El Foro del Jardín</div>
    <p style="color:var(--sepia);font-style:italic;margin:.8rem 0 2rem;max-width:380px;text-align:center;">Para leer y participar necesitas una cuenta gratuita.</p>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
      <button class="btn-hero btn-gold" style="border:none;" onclick="openModal('login')">Entrar</button>
      <button class="btn-hero btn-ghost" style="cursor:pointer;" onclick="openModal('register')">Unirse al jardín</button>
    </div></div>`
  const cats=[null,'doctrina','cuerpo','práctica','historia','preguntas','compartir']
  const catLabel={null:'Todo el jardín',doctrina:'Doctrina',cuerpo:'El Cuerpo','práctica':'Práctica',historia:'Historia Adamita',preguntas:'Preguntas',compartir:'🔒 Compartir'}
  const sidebar=`<div class="sidebar">
    <span class="sb-label" style="padding:1.5rem 1.4rem .55rem;">Categorías</span>
    ${cats.map(c=>`<button class="sb-item ${S.category===c?'active':''}" onclick="setCategory(${c?`'${c}'`:'null'})"><span class="sb-dot"></span>${catLabel[c]||c}</button>`).join('')}
    <hr class="sb-sep">
    <button class="new-btn" onclick="S.view='new';S.postFiles=[];render()">+ Nueva entrada</button>
    ${S.isAdmin?`<button class="new-btn" style="margin-top:.5rem;background:var(--bg2);color:var(--sepia);border:1px solid var(--border);" onclick="goSolicitudes()">Solicitudes compartir</button>`:''}
    <div class="sb-stat">
      <span class="sb-label" style="margin-top:.5rem;">El jardín</span>
      <div class="stat-row"><span class="stat-l">Miembros</span><span class="stat-v">${S.stats.members}</span></div>
      <div class="stat-row"><span class="stat-l">Entradas</span><span class="stat-v">${S.stats.posts}</span></div>
    </div></div>`
  let main=''
  if(S.view==='list')main=postList()
  else if(S.view==='post')main=postDetail()
  else if(S.view==='new')main=newPost()
  return`<div class="app-layout">${sidebar}<div class="content">${main}</div></div>`
}

function postList(){

function openModal(mode='login'){authMode=mode;switchTab(mode);document.getElementById('authModal').classList.remove('hidden');document.getElementById('authMsg').innerHTML='';setTimeout(()=>document.getElementById('fEmail')?.focus(),100)}
function closeModal(){document.getElementById('authModal').classList.add('hidden');S.afterLogin=null}
function switchTab(mode){
  authMode=mode
  document.getElementById('tabLogin').classList.toggle('active',mode==='login')
  document.getElementById('tabReg').classList.toggle('active',mode==='register')
  document.getElementById('usernameRow').style.display=mode==='register'?'block':'none'
  document.getElementById('authBtn').textContent=mode==='login'?'Entrar':'Unirse al jardín'
  document.getElementById('authMsg').innerHTML=''
}
function showAuthMsg(msg,ok=false){document.getElementById('authMsg').innerHTML=`<div class="${ok?'msg-ok':'msg-error'}">${msg}</div>`}
async function doAuth(){
  const email=document.getElementById('fEmail')?.value?.trim()
  const pass=document.getElementById('fPass')?.value
  if(!email||!pass){showAuthMsg('Completa email y contraseña');return}
  if(authMode==='register'){
    const domain=email.split('@')[1]?.toLowerCase()
    if(TEMP_DOMAINS.includes(domain)){showAuthMsg('Este tipo de email no está permitido.');return}
  }
  document.getElementById('authBtn').disabled=true
  if(authMode==='login'){
    const{error}=await sb.auth.signInWithPassword({email,password:pass})
    if(error){showAuthMsg('Email o contraseña incorrectos');document.getElementById('authBtn').disabled=false}
  }else{
    const username=document.getElementById('fUsername')?.value?.trim()
    if(!username){showAuthMsg('Elige un nombre para el jardín');document.getElementById('authBtn').disabled=false;return}
    if(pass.length<6){showAuthMsg('Mínimo 6 caracteres');document.getElementById('authBtn').disabled=false;return}
    const{data,error}=await sb.auth.signUp({email,password:pass})
    if(error){showAuthMsg(error.message);document.getElementById('authBtn').disabled=false;return}
    if(data.user)await sb.from('profiles').upsert({id:data.user.id,username,is_admin:email===ADMIN})
    showAuthMsg('Revisa tu email para confirmar tu cuenta.',true)
  }
  document.getElementById('authBtn').disabled=false
}
document.getElementById('authModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()})

function previewFiles(input,ctx){
  const files=Array.from(input.files).slice(0,4)
  const key={post:'postFiles',reply:'replyFiles',msg:'msgFiles'}[ctx]
  S[key]=files
  const cid={post:'postPreviews',reply:'replyPreviews',msg:'msgPreviews'}[ctx]
  const container=document.getElementById(cid);if(!container)return
  container.innerHTML=files.map((f,i)=>{const url=URL.createObjectURL(f);return`<div class="img-preview-item"><img src="${url}"><button class="img-remove" onclick="removeFile(${i},'${ctx}')">✕</button></div>`}).join('')
}
function removeFile(idx,ctx){const key={post:'postFiles',reply:'replyFiles',msg:'msgFiles'}[ctx];S[key].splice(idx,1);previewFiles({files:S[key]},ctx)}
async function uploadImages(files,folder){
  const urls=[]
  for(const file of files){
    const ext=file.name.split('.').pop().toLowerCase()||'jpg'
    const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`
    const{error}=await sb.storage.from('post-images').upload(path,file)
    if(!error){const{data}=sb.storage.from('post-images').getPublicUrl(path);urls.push(data.publicUrl)}
  }
  return urls
}

async function submitPost(){
  const title=document.getElementById('npTitle')?.value?.trim()
  const content=document.getElementById('npContent')?.value?.trim()
  const cat=document.getElementById('npCat')?.value||null
  const errEl=document.getElementById('npError')
  if(!title){errEl.innerHTML='<div class="msg-error">El título es necesario</div>';return}
  if(!content){errEl.innerHTML='<div class="msg-error">Escribe algo antes de publicar</div>';return}
  if(cat==='compartir'&&!S.isAdmin&&S.compartirAccess!=='approved'){errEl.innerHTML='<div class="msg-error">Necesitas acceso aprobado para publicar en Compartir</div>';return}
  const btn=document.querySelector('.np .send-btn');if(btn){btn.disabled=true;btn.textContent='Publicando...'}
  let imageUrls=[]
  if(S.postFiles.length)imageUrls=await uploadImages(S.postFiles,`posts/${S.user.id}`)
  const{error}=await sb.from('posts').insert({user_id:S.user.id,title,content,category:cat,is_admin_post:S.isAdmin,image_urls:imageUrls.length?JSON.stringify(imageUrls):null})
  if(error){errEl.innerHTML='<div class="msg-error">Error al publicar</div>';if(btn){btn.disabled=false;btn.textContent='Publicar'};return}
  S.postFiles=[];S.page='forum';S.view='list';await Promise.all([loadPosts(),loadStats()]);render()
}
async function submitReply(){
  const content=document.getElementById('replyText')?.value?.trim();if(!content)return
  const btn=document.getElementById('replyBtn');btn.disabled=true;btn.textContent='Enviando...'
  let imageUrls=[]
  if(S.replyFiles.length)imageUrls=await uploadImages(S.replyFiles,`replies/${S.user.id}`)
  const{error}=await sb.from('replies').insert({post_id:S.post.id,user_id:S.user.id,content,is_admin_reply:S.isAdmin,image_urls:imageUrls.length?JSON.stringify(imageUrls):null})
  if(!error&&S.isAdmin)await sb.from('posts').update({has_garden_reply:true}).eq('id',S.post.id)
  S.replyFiles=[];await loadPost(S.post.id);render()
}
async function sendPrivateMsg(){
  const content=document.getElementById('privMsgText')?.value?.trim()
  if(!content){alert('Escribe algo antes de enviar');return}
  const btn=document.getElementById('msgBtn');btn.disabled=true;btn.textContent='Enviando...'
  let imageUrls=[]
  if(S.msgFiles.length)imageUrls=await uploadImages(S.msgFiles,`msgs/${S.user.id}`)
  const{error}=await sb.from('private_messages').insert({user_id:S.user.id,content,image_urls:imageUrls.length?JSON.stringify(imageUrls):null})
  if(!error){document.getElementById('privMsgText').value='';S.msgFiles=[];const pre=document.getElementById('msgPreviews');if(pre)pre.innerHTML='';btn.textContent='✓ Enviado';setTimeout(()=>{btn.disabled=false;btn.textContent='Enviar mensaje privado'},2500)}
  else{btn.disabled=false;btn.textContent='Enviar mensaje privado'}
}

async function toggleMsg(id){
  if(!S.expandedMsgs[id]){S.expandedMsgs[id]=true;await sb.from('private_messages').update({is_read:true}).eq('id',id);S.unreadCount=Math.max(0,S.unreadCount-1);const m=S.messages.find(m=>m.id===id);if(m)m.is_read=true}
  else{delete S.expandedMsgs[id]}
  render()
}
async function markRead(id){await sb.from('private_messages').update({is_read:true}).eq('id',id);const m=S.messages.find(m=>m.id===id);if(m)m.is_read=true;S.unreadCount=Math.max(0,S.unreadCount-1);render()}
async function deleteMessage(id){if(!confirm('¿Borrar este mensaje?'))return;await sb.from('private_messages').delete().eq('id',id);S.messages=S.messages.filter(m=>m.id!==id);S.unreadCount=S.messages.filter(m=>!m.is_read).length;render()}
async function requestCompartirAccess(){if(!S.user){openModal('register');return}const{error}=await sb.from('compartir_access').insert({user_id:S.user.id,status:'pending'});if(!error||error.code==='23505'){S.compartirAccess='pending';render()}}
async function decideCompartir(solId,status){await sb.from('compartir_access').update({status}).eq('id',solId);S.solicitudes=S.solicitudes.filter(s=>s.id!==solId);render()}
async function deletePost(id){if(!confirm('¿Borrar esta entrada y todas sus respuestas?'))return;await sb.from('replies').delete().eq('post_id',id);await sb.from('posts').delete().eq('id',id);if(S.view==='post'){S.view='list';await loadPosts();render()}else{S.posts=S.posts.filter(p=>p.id!==id);render()}}
async function deleteReply(id){if(!confirm('¿Borrar esta respuesta?'))return;await sb.from('replies').delete().eq('id',id);S.replies=S.replies.filter(r=>r.id!==id);render()}

function sendContact(){
  const name=document.getElementById('cName')?.value?.trim()
  const email=document.getElementById('cEmail')?.value?.trim()
  const msg=document.getElementById('cMsg')?.value?.trim()
  const st=document.getElementById('cStatus')
  if(!msg){st.innerHTML='<div class="msg-error" style="margin-bottom:.8rem;">Escribe algo antes de enviar.</div>';return}
  const sub=encodeURIComponent(`Mensaje desde El Jardín${name?' de '+name:''}`)
  const body=encodeURIComponent(`${name?'Nombre: '+name+'\n':''}${email?'Email: '+email+'\n':''}\nMensaje:\n${msg}`)
  window.location.href=`mailto:${ADMIN}?subject=${sub}&body=${body}`
  st.innerHTML='<div class="msg-ok" style="margin-bottom:.8rem;">Abriendo tu cliente de email...</div>'
}

function wmHtml(username,rows=6,cols=4){const t2=esc(username)+' · El Jardín';const row=Array(cols).fill(`<span class="wm-text">${t2}</span>`).join('');return Array(rows).fill(`<div class="wm-row">${row}</div>`).join('')}
function protectedImg(url,postId='',small=false){
  if(!url)return''
  const size=small?'max-width:65px;max-height:48px;':'max-width:240px;max-height:200px;'
  if(S.isAdmin){return`<div class="admin-img-wrap" onclick="openLightbox('${url}','${postId}')"><img src="${url}" style="${size}object-fit:cover;border:1px solid var(--border);border-radius:3px;" draggable="false"><a class="dl-btn" onclick="event.stopPropagation();downloadImage('${url}')">⬇</a></div>`}
  const wm=wmHtml(S.profile?.username||'visitante',small?3:6,small?2:4)
  return`<div class="protected-wrap" style="${size}object-fit:cover;" oncontextmenu="return false" ondragstart="return false" onclick="openLightbox('${url}','${postId}')"><img src="${url}" style="${size}object-fit:cover;border:1px solid var(--border);border-radius:3px;" draggable="false"><div class="wm-overlay"><div class="wm-inner">${wm}</div></div></div>`
}
async function logPhotoView(postId){if(!S.user||!postId||S.isAdmin)return;await sb.from('photo_views').insert({post_id:postId,user_id:S.user.id,username:S.profile?.username||'Anónimo'})}
async function loadPhotoViews(postId){if(!S.isAdmin||!postId)return[];const{data}=await sb.from('photo_views').select('username, viewed_at').eq('post_id',postId).order('viewed_at',{ascending:false});return data||[]}
async function downloadImage(url){try{const res=await fetch(url);const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jardin-'+Date.now()+'.'+(blob.type.split('/')[1]||'jpg');a.click();URL.revokeObjectURL(a.href)}catch(e){window.open(url,'_blank')}}

function openLightbox(url,postId=''){
  currentLbUrl=url
  document.getElementById('lbImg').src=url
  document.getElementById('lightbox').classList.remove('hidden')
  document.getElementById('lightboxBg').style.display='block'
  const wmEl=document.getElementById('lbWm')
  const dlEl=document.getElementById('lbDl')
  if(S.isAdmin){wmEl.classList.add('hidden');dlEl.classList.remove('hidden')}
  else{document.getElementById('lbWmInner').innerHTML=wmHtml(S.profile?.username||'visitante',8,5);wmEl.classList.remove('hidden');dlEl.classList.add('hidden');if(postId)logPhotoView(postId)}
}
function closeLightbox(){document.getElementById('lightbox').classList.add('hidden');document.getElementById('lightboxBg').style.display='none';currentLbUrl=''}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>')}
function fmtDate(iso){if(!iso)return'';const d=new Date(iso),now=new Date(),diff=now-d;if(diff<60000)return'ahora mismo';if(diff<3600000)return`hace ${Math.floor(diff/60000)} min`;if(diff<86400000)return`hace ${Math.floor(diff/3600000)} h`;return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
function tryParse(s){try{return s?JSON.parse(s):[]}catch{return[]}}

init()
</script>
